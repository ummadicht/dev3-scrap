name: PR CI

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  secret-scan:
    name: 1. Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        run: |
          GITLEAKS_VERSION="8.30.1"
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          tar -xzf gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks git --redact --verbose --exit-code 1

  test-and-typecheck:
    name: 2. Python Syntax & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies & Syntax Check
        run: |
          pip install -r requirements.txt
          python -m compileall -q .
          if [ -d "tests" ] && [ -n "$(ls -A tests/*.py 2>/dev/null)" ]; then
            python -m unittest discover -s tests || true
          fi
