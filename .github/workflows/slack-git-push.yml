name: Git Push Notifications

on:
  push:

jobs:
  notify:
    name: Notify Slack on Git Push
    runs-on: ubuntu-slim

    permissions: {}

    # Ignore branch deletion events
    if: ${{ github.event.deleted == false }}

    steps:
      - name: Send Git Push Details to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_GIT_PUSH_WEBHOOK_URL }}

          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          PUSHER: ${{ github.actor }}

          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_SHA: ${{ github.event.head_commit.id }}
          COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}

        run: |
          set -euo pipefail

          COMMIT_DATE="$(TZ=Asia/Kolkata date -d "$COMMIT_TIMESTAMP" '+%Y-%m-%d %H:%M:%S IST')"
          COMMIT_URL="https://github.com/$REPOSITORY/commit/$COMMIT_SHA"

          jq -n \
            --arg repo "$REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg pusher "$PUSHER" \
            --arg author "$COMMIT_AUTHOR" \
            --arg message "$COMMIT_MSG" \
            --arg sha "$COMMIT_SHA" \
            --arg date "$COMMIT_DATE" \
            --arg url "$COMMIT_URL" \
            '{
              text: "New Git Push: \($repo)",
              blocks: [
                {
                  type: "header",
                  text: {
                    type: "plain_text",
                    text: "New Git Push Notification"
                  }
                },
                {
                  type: "section",
                  fields: [
                    {
                      type: "mrkdwn",
                      text: "*Repository:*\n\($repo)"
                    },
                    {
                      type: "mrkdwn",
                      text: "*Branch:*\n\($branch)"
                    },
                    {
                      type: "mrkdwn",
                      text: "*Pushed By:*\n\($pusher)"
                    },
                    {
                      type: "mrkdwn",
                      text: "*Commit Author:*\n\($author)"
                    },
                    {
                      type: "mrkdwn",
                      text: "*Pushed Time:*\n\($date)"
                    }
                  ]
                },
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: "*Commit Message:*\n\($message)"
                  }
                },
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: "*Commit SHA:*\n`\($sha)`"
                  }
                },
                {
                  type: "actions",
                  elements: [
                    {
                      type: "button",
                      text: {
                        type: "plain_text",
                        text: "View Commit"
                      },
                      url: $url,
                      style: "primary"
                    }
                  ]
                }
              ]
            }' > payload.json

          curl --fail-with-body \
            --silent \
            --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            --data @payload.json \
            "$SLACK_WEBHOOK_URL"
