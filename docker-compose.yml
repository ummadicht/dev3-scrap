services:
  mobile-scraping:
    image: mobile-scraping:${SCRAPER_TAG:-${IMAGE_TAG:-latest}}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mobile-scraping
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
    networks:
      - prod_net

networks:
  prod_net:
    external: true
    name: platform_prod_net
