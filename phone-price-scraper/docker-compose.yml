services:
  postgres:
    image: postgres:16-alpine
    container_name: phone_price_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-phone_prices}
      POSTGRES_USER: ${POSTGRES_USER:-scraper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scraper_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scraper} -d ${POSTGRES_DB:-phone_prices}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phone_price_app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-scraper}:${POSTGRES_PASSWORD:-scraper_password}@postgres:5432/${POSTGRES_DB:-phone_prices}
    volumes:
      - ./exports:/app/exports
      - ./raw:/app/raw
      - ./config:/app/config:ro
    command: ["sh", "-c", "uv run phone-scraper db migrate && uv run phone-scraper scrape schedule"]

volumes:
  postgres_data:
