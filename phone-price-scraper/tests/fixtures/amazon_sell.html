<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Amazon Trade-In Phone Offers</title>
</head>
<body>
  <div id="tradein-offers-container">
    <div
      class="tradein-device-card"
      data-asin="B0CHX2F5QT"
      data-brand="Apple"
      data-storage="128 GB"
      data-ram="6 GB"
      data-currency="INR"
      data-url="https://www.amazon.in/tradein/B0CHX2F5QT"
    >
      <h2 class="tradein-device-title">Apple iPhone 15 (128 GB) - Black</h2>
      <div class="tradein-condition-row" data-condition="Excellent" data-storage="128 GB">
        <span class="cond-label">Excellent</span>
        <span class="tradein-offer-price">₹41,500</span>
      </div>
      <div class="tradein-condition-row" data-condition="Good" data-storage="128 GB">
        <span class="cond-label">Good</span>
        <span class="tradein-offer-price">₹36,000</span>
      </div>
      <div class="tradein-condition-row" data-condition="Cracked Screen" data-storage="128 GB">
        <span class="cond-label">Cracked Screen</span>
        <span class="tradein-offer-price">₹19,250</span>
      </div>
    </div>

    <div
      class="tradein-device-card"
      data-asin="B0CS5Z3T4M"
      data-brand="Samsung"
      data-storage="256 GB"
      data-ram="12 GB"
      data-currency="INR"
      data-url="https://www.amazon.in/tradein/B0CS5Z3T4M"
    >
      <h2 class="tradein-device-title">Samsung Galaxy S24 Ultra 5G (256 GB)</h2>
      <div class="tradein-condition-row" data-condition="Like New" data-storage="256 GB">
        <span class="cond-label">Like New</span>
        <span class="tradein-offer-price">₹58,400</span>
      </div>
    </div>
  </div>
</body>
</html>
