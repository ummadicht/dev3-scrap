[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "phone-price-scraper"
version = "0.1.0"
description = "Modular mobile phone buyback & resale price collection, time-series storage, bucketing export, and trend analytics system."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.2",
  "apscheduler>=3.10.4",
  "beautifulsoup4>=4.12.3",
  "boto3>=1.34.0",
  "httpx>=0.27.0",
  "pandas>=2.2.2",
  "playwright>=1.45.0",
  "psycopg[binary]>=3.1.19",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "pyyaml>=6.0.1",
  "rich>=13.7.1",
  "selectolax>=0.3.21",
  "sqlalchemy>=2.0.30",
  "typer>=0.12.3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10.0",
  "pandas-stubs>=2.2.2",
  "pytest>=8.2.0",
  "ruff>=0.4.8",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
phone-scraper = "phone_scraper.cli:app"
scrape = "phone_scraper.cli:scrape_cli"
export = "phone_scraper.cli:export_cli"
trends = "phone_scraper.cli:trends_cli"
db = "phone_scraper.cli:db_cli"

[tool.hatch.build.targets.wheel]
packages = ["src/phone_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["phone_scraper"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
